<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAIDA QUANT NEXUS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar glass">
        <div>
          <p class="kicker">ZAIDA ECOSYSTEM • INSTITUTIONAL MODE</p>
          <h1>ZAIDA QUANT NEXUS</h1>
          <p class="muted">Futuristic multi-utility execution console (simulation mode).</p>
        </div>
        <div class="topbar-actions">
          <button id="themeButton" class="ghost">Theme</button>
          <button id="settingsButton" class="ghost">Risk</button>
          <button id="walletButton">Connect Wallet</button>
        </div>
      </header>

      <section class="grid">
        <article class="glass swap-panel">
          <h2>Execution Engine</h2>
          <div class="row"><label>From</label><select id="fromToken"></select><input id="fromAmount" type="number" placeholder="0.0" /></div>
          <button id="flipButton" class="ghost">⇅ Flip</button>
          <div class="row"><label>To</label><select id="toToken"></select><input id="toAmount" type="text" readonly placeholder="0.0" /></div>
          <div class="metrics" id="metrics"></div>
          <div class="actions"><button id="quoteButton">Quote</button><button id="swapButton" class="success">Execute Sim</button></div>
          <p id="status" class="muted">Awaiting wallet handshake.</p>
        </article>

        <article class="glass"><h2>Smart Routes</h2><div id="routes"></div></article>
        <article class="glass"><h2>PnL & Balances</h2><div id="portfolio"></div></article>
        <article class="glass"><h2>Market Radar</h2><div id="watch"></div></article>
        <article class="glass"><h2>Ops Feed</h2><div id="activity"></div></article>
        <article class="glass"><h2>Utility Stack</h2><div id="utility"></div></article>
      </section>
    </main>

    <dialog id="settingsDialog">
      <form method="dialog" class="panel">
        <h3>Risk Controls</h3>
        <label>Slippage % <input id="slippageInput" type="number" min="0.1" max="10" step="0.1" value="0.5" /></label>
        <label>Max position USD <input id="maxPosInput" type="number" min="50" step="50" value="5000" /></label>
        <label>Fee profile <select id="feeTier"><option>Low</option><option selected>Medium</option><option>High</option></select></label>
        <menu><button value="cancel" class="ghost">Cancel</button><button id="saveSettings" value="default">Save</button></menu>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
